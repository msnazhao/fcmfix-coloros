name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  # The NDK the pinned LSPlant commit declares (gradle/libs.versions.toml).
  NDK_VERSION: 29.0.14206865
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          # <upstream major>.<upstream minor>.<this fork's revision, 0-999>
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]{1,3}$ ]] \
            || { echo "::error::versionName $VERSION_NAME is not <upstream>.<revision 0-999>"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$VERSION_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME is not v$VERSION_NAME"; exit 1; }
          [ -f "docs/releases/$VERSION_NAME.md" ] \
            || { echo "::error::missing docs/releases/$VERSION_NAME.md"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Install NDK and platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          command -v ninja > /dev/null || sudo apt-get install -y ninja-build
      - name: Decode the signing key
        # A release without the app inside would install a module with no way to configure it.
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for v in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS; do
            [ -n "${!v:-}" ] || { echo "::error::missing signing secret $v"; exit 1; }
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build, test and sign
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          bash zygisk/build.sh
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Name the files and write update.json
        shell: bash
        run: |
          set -euo pipefail
          cd zygisk/build
          ZIP="FCMFix-Zygisk-$VERSION_NAME.zip"
          # One zip, named by version only: update.json and the release page point at this name.
          [ "$(ls FCMFix-Zygisk-*.zip | wc -l)" -eq 1 ]
          mv FCMFix-Zygisk-*.zip "$ZIP"
          unzip -l "$ZIP" | grep -q ' fcmfix.apk$' || { echo "::error::the zip has no app"; exit 1; }
          unzip -l "$ZIP" | grep -q ' zygisk/arm64-v8a.so$' || { echo "::error::the zip has no library"; exit 1; }
          sha256sum "$ZIP" > SHA256SUMS
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' ../../app/build.gradle)
          BASE="https://github.com/$GITHUB_REPOSITORY"
          # The root manager compares versionCode; the manager's update check reads this file from
          # the updateJson URL in module.prop (the latest non-prerelease release).
          jq -n --arg version "$VERSION_NAME" --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "$BASE/releases/download/$GITHUB_REF_NAME/$ZIP" \
            --arg changelog "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/docs/releases/$VERSION_NAME.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' > update.json
          cat update.json SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: FCMFix-Zygisk ${{ env.VERSION_NAME }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: docs/releases/${{ env.VERSION_NAME }}.md
          files: |
            zygisk/build/FCMFix-Zygisk-${{ env.VERSION_NAME }}.zip
            zygisk/build/update.json
            zygisk/build/SHA256SUMS
